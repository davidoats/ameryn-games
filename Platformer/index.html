<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Explorer</title>
<style>
body{margin:0;background:white;display:flex;justify-content:center;align-items:center;height:100vh;}
canvas{background:#87CEEB;border:5px solid #e879d2;}

#exitButton {
  padding: 10px 16px;
  font-size: 20px;
  border: none;
  background: #ff4d88;
  color: white;
  cursor: pointer;
  position: absolute;
  top: 10px;
  right: 10px;
  
}

#resetButton {
  padding: 10px 16px;
  font-size: 10px;
  border: none;
  background: #ff4d88;
  color: white;
  cursor: pointer;
  position: absolute;
  top: 10px;
  left: 10px;
}
</style>
</head>

<body>
<canvas id="game" width="800" height="450"></canvas>
<button id="resetButton">Reset?</button>
<button id="exitButton">X</button>
<script defer src="./logic/init.js"></script>
<script defer src="./logic/texture.js"></script>
<script defer src="./logic/world.js"></script>
<script defer src="./logic/inventory.js"></script>
<script defer src="./logic/crafting.js"></script>
<script defer src="./logic/player.js"></script>
<script defer src="./logic/input.js"></script>
<script defer src="./logic/interaction.js"></script>
<script defer src="./logic/save.js"></script>
<script defer src="./logic/render.js"></script>
<script defer src="./logic/engine.js"></script>

<script>
  document.getElementById("exitButton").onclick = () => {
  document.location.href = 'https://davidoats.github.io/ameryn-games/Selection/'
};

document.getElementById("resetButton").onclick = () => {
  resetWorld()
};
</script>
</body>
</html>
