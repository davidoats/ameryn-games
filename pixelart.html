<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pixel Studio</title>

<style>
body {
  margin: 0;
  background: #1a1a1a;
  color: white;
  font-family: monospace;
  display: flex;
  height: 100vh;
}

#ui {
  width: 260px;
  background: #111;
  padding: 10px;
  overflow-y: auto;
}

button, input {
  width: 100%;
  margin: 4px 0;
  background: #333;
  color: white;
  border: none;
  padding: 6px;
  cursor: pointer;
}

canvas {
  image-rendering: pixelated;
  background: #222;
}

#canvasWrap {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
}

.palette {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
}

.swatch {
  height: 30px;
  cursor: pointer;
  border: 2px solid transparent;
}
.swatch.active { border: 2px solid white; }

h3 { margin: 6px 0; }
</style>
</head>

<body>

<div id="ui">

<h3>Tool</h3>
<button onclick="tool='draw'">Draw</button>
<button onclick="tool='erase'">Erase</button>
<button onclick="toggleSym()">Symmetry</button>

<h3>Frames</h3>
<button onclick="newFrame()">New Frame</button>
<button onclick="play()">Play Animation</button>

<h3>Import / Export</h3>
<input type="file" id="importFile" accept="image/png">
<button onclick="exportPNG()">Export PNG</button>
<button onclick="exportSheet()">Sprite Sheet</button>

<h3>Palette</h3>
<div class="palette" id="palette"></div>
<input type="color" id="picker">

<h3>View</h3>
<button onclick="zoom*=2">Zoom +</button>
<button onclick="zoom/=2">Zoom -</button>
<button onclick="grid=!grid">Toggle Grid</button>

</div>

<div id="canvasWrap">
<canvas id="c"></canvas>
</div>

<script>

const size = 32;
let zoom = 16;
let grid = true;
let tool = 'draw';
let symmetry = false;
let playing = false;

const palette = [
  "#000000","#ffffff","#ff0044","#00ff88",
  "#4488ff","#ffff00","#ff8800","#aa00ff"
];

let color = palette[1];
let frameIndex = 0;
let frames = [newFrameData()];
let undo = [];

const c = document.getElementById('c');
const ctx = c.getContext('2d');

function newFrameData() {
  return Array(size).fill().map(()=>Array(size).fill(0));
}

function buildPalette() {
  const p = document.getElementById("palette");
  p.innerHTML = "";
  palette.forEach((col,i)=>{
    const d = document.createElement("div");
    d.className="swatch";
    d.style.background=col;
    d.onclick=()=>{color=col;updatePalette()};
    p.appendChild(d);
  });
  updatePalette();
}

function updatePalette() {
  document.querySelectorAll(".swatch").forEach((s,i)=>{
    s.classList.toggle("active",palette[i]==color);
  });
}

document.getElementById("picker").oninput = e=>{
  palette.push(e.target.value);
  buildPalette();
};

function resizeCanvas() {
  c.width = size*zoom;
  c.height = size*zoom;
}

function draw() {
  ctx.clearRect(0,0,c.width,c.height);

  let frame = frames[frameIndex];

  for(let y=0;y<size;y++){
    for(let x=0;x<size;x++){
      let col = frame[y][x];
      if(col){
        ctx.fillStyle=col;
        ctx.fillRect(x*zoom,y*zoom,zoom,zoom);
      }
    }
  }

  if(grid){
    ctx.strokeStyle="#333";
    for(let i=0;i<=size;i++){
      ctx.beginPath();
      ctx.moveTo(i*zoom,0);
      ctx.lineTo(i*zoom,c.height);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(0,i*zoom);
      ctx.lineTo(c.width,i*zoom);
      ctx.stroke();
    }
  }
}

function setPixel(x,y,col) {
  if(x<0||y<0||x>=size||y>=size) return;
  frames[frameIndex][y][x]=col;
}

c.onmousedown=e=>{
  undo.push(JSON.stringify(frames));
  paint(e);
  c.onmousemove=paint;
};

c.onmouseup=()=>c.onmousemove=null;

function paint(e){
  const rect=c.getBoundingClientRect();
  const x=Math.floor((e.clientX-rect.left)/zoom);
  const y=Math.floor((e.clientY-rect.top)/zoom);

  let col = tool=='erase'?0:color;
  setPixel(x,y,col);
  if(symmetry) setPixel(size-1-x,y,col);
}

window.onkeydown=e=>{
  if(e.ctrlKey&&e.key=="z"&&undo.length){
    frames=JSON.parse(undo.pop());
  }
};

function newFrame(){
  frames.push(newFrameData());
  frameIndex=frames.length-1;
}

function play(){
  playing=!playing;
  if(playing) anim();
}

function anim(){
  if(!playing) return;
  frameIndex=(frameIndex+1)%frames.length;
  draw();
  setTimeout(anim,150);
}

function toggleSym(){
  symmetry=!symmetry;
}

function exportPNG(){
  const tmp=document.createElement("canvas");
  tmp.width=size;
  tmp.height=size;
  const t=tmp.getContext("2d");

  let f=frames[frameIndex];
  for(let y=0;y<size;y++)
    for(let x=0;x<size;x++){
      if(f[y][x]){
        t.fillStyle=f[y][x];
        t.fillRect(x,y,1,1);
      }
    }

  const a=document.createElement("a");
  a.href=tmp.toDataURL();
  a.download="pixel.png";
  a.click();
}

function exportSheet(){
  const tmp=document.createElement("canvas");
  tmp.width=size*frames.length;
  tmp.height=size;
  const t=tmp.getContext("2d");

  frames.forEach((f,i)=>{
    for(let y=0;y<size;y++)
      for(let x=0;x<size;x++){
        if(f[y][x]){
          t.fillStyle=f[y][x];
          t.fillRect(i*size+x,y,1,1);
        }
      }
  });

  const a=document.createElement("a");
  a.href=tmp.toDataURL();
  a.download="spritesheet.png";
  a.click();
}

/* PNG IMPORT */

document.getElementById("importFile").onchange = function(e){
  const file = e.target.files[0];
  if(!file) return;

  const img = new Image();
  img.onload = function(){
    const tmp = document.createElement("canvas");
    tmp.width = size;
    tmp.height = size;
    const t = tmp.getContext("2d");

    t.imageSmoothingEnabled = false;
    t.drawImage(img, 0, 0, size, size);

    const data = t.getImageData(0,0,size,size).data;
    const frame = newFrameData();

    for(let y=0;y<size;y++){
      for(let x=0;x<size;x++){
        const i = (y*size+x)*4;
        const r=data[i];
        const g=data[i+1];
        const b=data[i+2];
        const a=data[i+3];

        if(a===0){
          frame[y][x]=0;
        } else {
          const hex = "#" +
            r.toString(16).padStart(2,"0") +
            g.toString(16).padStart(2,"0") +
            b.toString(16).padStart(2,"0");

          frame[y][x]=hex;

          if(!palette.includes(hex)){
            palette.push(hex);
          }
        }
      }
    }

    frames[frameIndex] = frame;
    buildPalette();
  };

  img.src = URL.createObjectURL(file);
};

function loop(){
  resizeCanvas();
  draw();
  requestAnimationFrame(loop);
}

buildPalette();
loop();

</script>

</body>
</html>
