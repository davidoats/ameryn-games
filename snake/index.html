<!DOCTYPE html>
<html lang="en">
<head>

<link href="./looks/styles.css" rel="stylesheet">
<title>Snake</title>
</head>
<body>

<canvas id="game" width="400" height="400"></canvas>

<div class="overlay" id="deathScreen">
  <div class="card">

  </div>
</div>

<button id="exitButton">X</button>
<script src="./feels/index.js"></script>
</body>
</html>
